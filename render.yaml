# Render.com Blueprint — ตั้งค่า backend service อัตโนมัติจากไฟล์นี้
# วิธีใช้: Render Dashboard > New > Blueprint > เชื่อม repo นี้ > Render จะอ่าน
# ไฟล์นี้แล้วสร้าง service ให้เอง (ไม่ต้องตั้งค่าผ่านหน้าเว็บทีละอันเอง)
#
# หลัง service ถูกสร้างแล้ว ต้องเข้าไปเติมค่า secret 3 ตัวเองใน Render
# Dashboard > Environment (ไฟล์นี้จงใจไม่ใส่ค่าจริงเพื่อไม่ให้ secret หลุดขึ้น
# git) — ดูรายละเอียดว่าต้องใส่อะไรบ้างใน backend/.env.example

services:
  - type: web
    name: times-the-calendar-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: FIREBASE_PROJECT_ID
        sync: false # ตั้งเองใน Dashboard — ไม่ใช่ secret แต่ให้ตั้งพร้อมกับตัวอื่นในที่เดียว
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false # secret — วางเนื้อหาไฟล์ service account JSON ทั้งก้อนที่นี่
      - key: FRONTEND_URL
        sync: false # เช่น https://<username>.github.io/times-the-calendar
      - key: PORT
        value: 4000
