          if(window.testCalendarFailure && input.text.includes('วันนี้มีอะไร')) throw Object.assign(new Error('อ่าน Calendar ไม่สำเร็จ'),{code:window.testCalendarFailure});

          if(window.testDraftDeferred) return new Promise(resolve=>{window.resolveTestDraft=()=>resolve(result);});

        }}))));
