<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-labelledby="title desc">
  <title id="title">TXph</title>
  <desc id="desc">TXph custom geometric wordmark</desc>
  <!-- A shared 14-unit stem establishes the family; chamfered terminals give the letters a precise, engineered character. -->
  <g fill="#1C1C1A">
    <!-- T: a disciplined crossbar with a single directional cut. -->
    <path d="M14 16h74l-8 14H57v50H41V30H20z"/>
    <!-- X: two interlocking diagonal strokes, held to the same weight. -->
    <path d="M101 16h19l17 22 16-22h19l-25 32 26 32h-19l-17-22-16 22h-19l25-32z"/>
    <!-- p: geometric bowl with a proportioned counter and a true descender. -->
    <path fill-rule="evenodd" d="M190 34h32c20 0 33 10 33 25s-13 25-33 25h-17v8h-15zm15 14v22h16c11 0 18-3 18-11s-7-11-18-11z"/>
    <!-- h: the ascender echoes T while the shoulder repeats p's radius. -->
    <path d="M269 16h15v22c5-4 11-6 19-6 18 0 29 11 29 28v20h-15V61c0-10-5-15-14-15-12 0-19 7-19 19v15h-15z"/>
  </g>
  <!-- A narrow Phi-ratio-inspired seam gives X a restrained orange focal point. -->
  <path fill="#D85A30" d="M134.5 43h5l4 5-4 5h-5l4-5z"/>
</svg>
