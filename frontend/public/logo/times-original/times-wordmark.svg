<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>T.i.M.E.S. logo</title>
<desc>โลโก้ T.i.M.E.S. พร้อมไอคอนวงแหวน-จุด และชื่อเต็มด้านล่าง</desc>

<!-- Icon mark: ring = cycle/system, dot = present task, small tick = "clock" reference -->
<g transform="translate(46,72)">
  <circle cx="0" cy="0" r="34" fill="none" stroke="#1C1C1A" stroke-width="3"/>
  <circle cx="0" cy="0" r="34" fill="none" stroke="#D85A30" stroke-width="3" stroke-dasharray="18 190" stroke-linecap="round" transform="rotate(-90)"/>
  <line x1="0" y1="0" x2="0" y2="-20" stroke="#1C1C1A" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="0" x2="14" y2="6" stroke="#1C1C1A" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="0" r="5" fill="#D85A30"/>
</g>

<!-- Wordmark -->
<g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="72" fill="#1C1C1A">
<text x="108" y="98">T</text>
<text x="172" y="98" font-size="34" fill="#8A8A85">.</text>
<rect x="193" y="68" width="14" height="30" fill="#1C1C1A"/>
<text x="222" y="98" font-size="34" fill="#8A8A85">.</text>
<text x="242" y="98">M</text>
<text x="312" y="98" font-size="34" fill="#8A8A85">.</text>
<text x="332" y="98">E</text>
<text x="390" y="98" font-size="34" fill="#8A8A85">.</text>
<text x="410" y="98">S</text>
<text x="468" y="98" font-size="34" fill="#8A8A85">.</text>
</g>
<circle cx="200" cy="46" r="7" fill="none" stroke="#D85A30" stroke-width="1.5" opacity="0.4"/>
<circle cx="200" cy="46" r="3.5" fill="#D85A30"/>

<!-- Divider -->
<line x1="108" y1="122" x2="500" y2="122" stroke="#E4E2DC" stroke-width="1.5"/>

<!-- Full name tagline -->
<g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="1.8" fill="#8A8A85">
<text x="108" y="142">TASK</text>
<text x="160" y="142" fill="#D85A30">INTERACTIVE</text>
<text x="275" y="142">&amp; MANAGEMENT</text>
<text x="108" y="160">EFFICIENCY</text>
<text x="205" y="160">INTELLIGENT</text>
<text x="320" y="160">SYSTEM</text>
</g>
</svg>
