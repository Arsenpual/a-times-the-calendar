<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="16 -64 480 480" role="img" aria-labelledby="title desc">
  <title id="title">T×𝞿 cube icon</title>
  <desc id="desc">A cube viewed edge-first: T and a multiplication sign on the left, phi on the right, and a minimal alarm clock on the top face.</desc>
  <!-- Complete top plane, sharing its edges with the two lettered walls. -->
  <path fill="#E4E2DC" d="M256-44 448 64 256 172 64 64z"/>
  <!-- Alarm clock follows the same isometric plane as the cube's top. -->
  <g transform="matrix(1 .5625 -1 .5625 256 -44)" fill="none" stroke="#1C1C1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="96" cy="98" r="44"/>
    <path d="M96 73v25l19 12 M42 48q8-19 28-14 M122 34q20-5 28 14 M64 143l-10 16 M128 143l10 16"/>
  </g>
  <!-- The glyphs are custom paths with transparent counters, not font text. -->
  <style>@media (prefers-color-scheme: dark) { .cube-ink { fill: #F2F1ED; } }</style><g fill-rule="evenodd">
    <!-- Left wall: T×. Both face transforms share the front vertical edge. -->
    <path id="face-t-times" class="cube-ink" fill="#1C1C1A" transform="matrix(1 .5625 0 1 64 64)" d="M0 0h192v220H0z M22 42h82v32H79v104H47V74H22z M119 89l21 24 21-24 15 13-23 27 23 27-15 13-21-24-21 24-15-13 23-27-23-27z"/>
    <!-- Right wall: phi, drawn as one stem-and-bowl contour with two counters. -->
    <path id="face-phi" fill="#D85A30" transform="matrix(1 -.5625 0 1 256 172)" d="M0 0h192v220H0z M84 26h24v28c42 4 66 26 66 56s-24 52-66 56v28H84v-28c-42-4-66-26-66-56s24-52 66-56z M84 78c-26 4-40 16-40 32s14 28 40 32z M108 78v64c26-4 40-16 40-32s-14-28-40-32z"/>
  </g>
</svg>
