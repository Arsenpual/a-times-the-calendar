name: Deploy frontend to GitHub Pages

# รันอัตโนมัติทุกครั้งที่ push เข้า main (เฉพาะตอนที่ไฟล์ใน frontend/ เปลี่ยน
# — กันไม่ให้ build ใหม่ทุกครั้งที่แก้แค่ backend หรือเอกสาร)
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # กดรันเองจากแท็บ Actions ได้ด้วย เผื่ออยาก redeploy โดยไม่มีการเปลี่ยนโค้ด

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # ค่า VITE_* ทั้งหมดต้องตั้งเป็น GitHub Actions secrets ก่อน (Settings >
        # Secrets and variables > Actions) — ค่าพวกนี้ถูก "ฝัง" เข้าไปในไฟล์
        # JS ตอน build (ไม่ใช่ secret ที่แอบซ่อนได้จริงหลัง build เสร็จ แต่
        # Firebase client config ปลอดภัยที่จะ expose อยู่แล้วตามที่ frontend.md
        # อธิบายไว้ — access control อยู่ที่ Firebase Auth + Security Rules)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # ตั้ง base path อัตโนมัติจากชื่อ repo (เช่น "/times-the-calendar/")
          # — จำเป็นเพราะ GitHub Pages เสิร์ฟจาก subpath เสมอ ดู vite.config.js
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
